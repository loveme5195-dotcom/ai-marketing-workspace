<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>整合行銷企劃報告工作台</title><link rel="stylesheet" href="../assets/style.css"><script defer src="../assets/model.js"></script><script defer src="../assets/strategy-model.js"></script><script defer src="../assets/audience-model.js"></script><script defer src="../assets/market-model.js"></script><script defer src="../assets/goal-model.js"></script><script defer src="../assets/journey-model.js"></script><script defer src="../assets/ops-model.js"></script><script defer src="../assets/report-model.js"></script><script defer src="../assets/learning-model.js"></script><script defer src="../assets/experiment-model.js"></script><script defer src="../assets/vendor/docx.umd.js"></script><script defer src="../assets/vendor/pdf-lib.min.js"></script><script defer src="../assets/report-export.js"></script><script defer src="../assets/report.js"></script></head><body class="tool-body"><div id="report-root" class="tool-root"><div id="loading" class="empty-state">讀取共用專案…</div><div id="report-editor" hidden><div class="report-controls"><div id="report-summary" class="vpc-summary"></div><p id="report-state" role="status"></p><div class="report-settings"><div><label for="report-mode">彙整深度</label><select id="report-mode"><option value="summary">企劃摘要（節錄與重點）</option><option value="full">完整工具彙整</option></select></div><label class="checkbox-label"><input id="include-customers" type="checkbox">收錄顧客代碼明細</label><button id="compile-report" class="primary">從目前資料產生／重新彙整</button></div><p class="hint">變更深度與明細設定後，需重新彙整才會更新章節；重新彙整將替換本頁文字。原工具不變。</p><div class="tool-actions"><button id="edit-meta">編輯封面資訊</button><button id="ai-tool-button" class="primary">AI 摘要與執行建議 ✦</button><button id="jump-preview">查看報告預覽 ↓</button></div><details class="teaching-details"><summary>選擇收錄章節與編輯文字</summary><div id="chapter-list"></div></details><div class="report-export-actions"><button id="expor
